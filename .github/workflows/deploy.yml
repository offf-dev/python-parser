name: Deploy parser to stage

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-stage
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect changed services
        id: changed
        run: |
          set -euo pipefail
          changed=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || git ls-files)
          fe=false; nc=false
          if echo "$changed" | grep -q '^services/fe-articles/'; then fe=true; fi
          if echo "$changed" | grep -q '^services/number-challenge/'; then nc=true; fi
          # Изменения в корне (compose, deploy-скрипт) → пересобираем оба
          if echo "$changed" | grep -qE '^(docker-compose\.yml|deploy\.sh)$'; then
            fe=true; nc=true
          fi
          echo "fe=$fe" >> "$GITHUB_OUTPUT"
          echo "nc=$nc" >> "$GITHUB_OUTPUT"
          echo "changed services: fe=$fe nc=$nc"
          echo "$changed"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          FE: ${{ steps.changed.outputs.fe }}
          NC: ${{ steps.changed.outputs.nc }}
        with:
          host: ${{ secrets.SERVER_IP_STAGE }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          envs: FE,NC
          script_stop: true
          script: |
            set -euo pipefail

            cd /var/www/python-parser

            echo "==> git pull origin main"
            git fetch --quiet origin main
            git reset --hard origin/main
            git clean -fd  # убираем untracked — на dev-сервере это сейф, /var/www/python-parser именно для прод-копии

            if [ "${FE:-false}" = "true" ]; then
              echo "==> rebuild + restart fe-articles"
              docker compose up -d --build fe-articles
            fi
            if [ "${NC:-false}" = "true" ]; then
              echo "==> rebuild + restart number-challenge"
              docker compose up -d --build number-challenge
            fi

            if [ "${FE:-false}" != "true" ] && [ "${NC:-false}" != "true" ]; then
              echo "==> ничего не изменилось в сервисах — пропускаем rebuild"
            fi

            echo "==> docker ps"
            docker compose ps