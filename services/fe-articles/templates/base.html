<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Парсер статей{% endblock %}</title>
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    {% block head_extra %}{% endblock %}
</head>
<body>

<nav class="topbar">
    <div class="topbar__inner">
        <div class="topbar__links">
            <a href="/" class="topbar__link {% if current_page == 'main' %}topbar__link--active{% endif %}">Main</a>
            <a href="/sites" class="topbar__link {% if current_page == 'sites' %}topbar__link--active{% endif %}">Resources</a>
            <a href="/domains" class="topbar__link {% if current_page == 'domains' %}topbar__link--active{% endif %}">Domains</a>
            <a href="/links" class="topbar__link {% if current_page == 'links' %}topbar__link--active{% endif %}">Articles</a>
            <a href="/debug" class="topbar__link {% if current_page == 'debug' %}topbar__link--active{% endif %}">Debug HTML</a>
        </div>
        <div class="topbar__mode">
            Resources: {{ resources_mode }} | Articles: {{ articles_mode }}
        </div>
    </div>
</nav>

<main class="container">
    {% block content %}{% endblock %}
</main>

<!-- Global page-loader overlay -->
<div id="globalLoader" class="loader-overlay" style="display:none;">
    <div class="loader-spinner"></div>
</div>

<script>
    window.showLoader = () => { document.getElementById('globalLoader').style.display = 'flex'; };
    window.hideLoader = () => { document.getElementById('globalLoader').style.display = 'none'; };

    // Event delegation чтобы работать с динамически вставляемыми
    // элементами (pagination после ajax updatePage и т.п.).
    document.addEventListener('submit', () => showLoader());
    document.addEventListener('click', (e) => {
        // Cmd/Ctrl/Shift/Alt-клик или средняя кнопка — браузер открывает
        // в новой табе/окне, текущая страница не уходит. Loader не нужен.
        if (e.ctrlKey || e.metaKey || e.shiftKey || e.altKey || e.button === 1) return;
        const a = e.target.closest('a[href]');
        if (!a || a.target === '_blank') return;
        const h = a.getAttribute('href');
        if (!h || h.startsWith('#') || h.startsWith('javascript:')) return;
        showLoader();
    });
    // Auxclick для middle-click (некоторые браузеры не шлют его в обычный click)
    document.addEventListener('auxclick', (e) => {
        // Не показываем loader на middle-click — это всегда new-tab
        // (handler пуст, нужен только чтобы не пересечься с регулярным click)
    });

    // На bfcache-восстановление (Back/Forward) — гарантированно скрыть loader.
    window.addEventListener('pageshow', () => hideLoader());
</script>

{% block scripts %}{% endblock %}
</body>
</html>
