services:
  fe-articles:
    build: ./services/fe-articles
    ports:
      - "5000:5000"
    volumes:
      - ./services/fe-articles/data:/app/data
      - ./services/fe-articles/logs:/app/logs
      - ./services/fe-articles/static/icons:/app/static/icons
    env_file:
      - ./services/fe-articles/.env
    # PID 1 = tini → reaps zombie chrome-headless процессы, которые Playwright
    # оставляет при неудачном browser.close(). Без этого они копились до 900+
    # за сутки и упирали процесс в kernel-limits (EAGAIN на pthread_create).
    init: true
    # Жёсткий потолок процессов в контейнере. Нормальный пик ~30-40 (python +
    # один chromium со своим пулом воркеров). 256 даёт запас, но не позволяет
    # утечке расти бесконтрольно — fail fast лучше чем тихая деградация.
    pids_limit: 256
    restart: unless-stopped

  number-challenge:
    build: ./services/number-challenge
    ports:
      - "5001:5000"
    volumes:
      - ./services/number-challenge/data:/app/data
    env_file:
      - ./services/number-challenge/.env
    restart: unless-stopped
